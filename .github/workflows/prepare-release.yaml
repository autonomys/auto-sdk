name: Prepare release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Prepare release on main, not ${GITHUB_REF#refs/heads/}."
          exit 1

      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check the current version is released
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          if ! git rev-parse --verify --quiet "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is on main but not tagged, so its release has not finished. Finish it from the Release workflow before preparing another."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install

      - name: Generate PR-based changelog
        run: yarn changelog
        env:
          BUMP_TYPE: ${{ inputs.releaseType }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump the version and push the release branch
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for release" || echo "No changes to commit"

          # The tag lerna creates stays local: the Release workflow tags main once the packages are published.
          yarn lerna version "$RELEASE_TYPE" --yes --no-push --force-publish

          VERSION=$(node -p "require('./lerna.json').version")
          BRANCH="chore-v$VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"

          TITLE=$(jq -rn --arg s "chore: release v$VERSION" '$s|@uri')
          BODY=$(jq -rn --arg s "Release v$VERSION" '$s|@uri')
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1&title=$TITLE&body=$BODY"
          echo "Open the release PR: $URL"
          echo "### [Open the release PR for v$VERSION]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Merging it publishes v$VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
