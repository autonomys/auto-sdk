name: Release

# Publishes the version in lerna.json once a release PR from Prepare release merges into main.
# Pushes that leave the version unchanged find it already tagged and stop at the plan job.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (build and verify npm trusted publishing, publish nothing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases publish from main, not ${GITHUB_REF#refs/heads/}."
          exit 1

      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the version to release
        id: plan
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Build and tag the commit that set the version, not the merge commit. PRs merged after
          # Prepare release would otherwise ship in this release but appear in neither its changelog
          # nor the next one's.
          COMMIT=$(git log --format=%H -S"\"version\": \"$VERSION\"" -- lerna.json | tail -n 1)
          if [ -z "$COMMIT" ]; then
            echo "::error::Could not find the commit that set version $VERSION in lerna.json."
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "v$VERSION was set in $COMMIT."
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is not tagged yet, so it will be published."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' || inputs.dryRun
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build all packages 🔧
        run: yarn build

      - name: Run tests 🧪
        run: yarn test:unit

      - name: Pack packages 📦
        run: node scripts/pack-packages.js tarballs

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: tarballs
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' || inputs.dryRun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: tarballs

      - name: Verify npm trusted publishing
        run: node scripts/verify-npm-trusted-publishing.js tarballs/manifest.json

      - name: Publish to npm
        run: node scripts/publish-packages.js tarballs/manifest.json
        env:
          DRY_RUN: ${{ inputs.dryRun || false }}

  github-release:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true' && !inputs.dryRun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - name: Tag the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: CHANGELOG.md
          tag_name: v${{ needs.plan.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
