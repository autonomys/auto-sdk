name: Release

# Only the push that changes lerna.json's version publishes. Manual dispatch is
# always an unprivileged dry run. All checkouts use the original event commit.
on:
  push:
    branches:
      - main
    paths:
      - lerna.json
  workflow_dispatch:

permissions: {}

# Queue rather than cancel releases, including while environment approval waits.
concurrency:
  group: auto-sdk-production-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: plan
        run: node scripts/release/workflow.js plan
        env:
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build release packages
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Preserve any previously sealed release artifacts
        run: node scripts/release/workflow.js guard-assembly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
        env:
          NX_DAEMON: 'false'
          NX_SKIP_NX_CACHE: 'true'

      - run: yarn test:unit
        env:
          NX_DAEMON: 'false'
          NX_SKIP_NX_CACHE: 'true'

      # The common ancestor is packages/. The artifact therefore contains
      # auto-utils/dist/..., utility/asynchronous/dist/..., etc.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: release-compiled-${{ github.run_attempt }}
          path: |
            packages/*/dist/
            packages/utility/*/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  assemble:
    name: Assemble release packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-commit: ${{ steps.assemble.outputs.source-commit }}
      manifest-sha256: ${{ steps.assemble.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Preserve any previously sealed release artifacts
        run: node scripts/release/workflow.js guard-assembly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No dependency install or build scripts in this fresh job.
      - name: Test assembly and publication boundaries
        run: node --test scripts/release/*.test.js

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/compiled-outputs

      - name: Assemble packages from reviewed source and compiled files
        id: assemble
        run: node scripts/release/assemble.js "$RUNNER_TEMP/compiled-outputs" "$RUNNER_TEMP/release-packages"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: release-packages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 90

      - name: Record the trusted recovery identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          SOURCE_COMMIT: ${{ steps.assemble.outputs.source-commit }}
          MANIFEST_SHA256: ${{ steps.assemble.outputs.manifest-sha256 }}
        run: |
          # shellcheck disable=SC2016 # Backticks are literal Markdown in the summary.
          printf 'Artifact ID: `%s`\n\nSource commit: `%s`\n\nManifest SHA-256: `%s`\n\nRecover with **Re-run failed jobs**, using these original outputs. Do not rebuild.\n' \
            "$ARTIFACT_ID" "$SOURCE_COMMIT" "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"

  verify-installation:
    name: Verify release installation
    needs: [plan, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-packages

      - name: Verify the publisher's inputs without credentials or registry access
        env:
          SOURCE_COMMIT: ${{ needs.assemble.outputs.source-commit }}
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest-sha256 }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node scripts/release/publish.js "$RUNNER_TEMP/release-packages" \
            --source-commit "$SOURCE_COMMIT" --manifest-sha256 "$MANIFEST_SHA256" --tag "$TAG"

      - name: Install and check the assembled packages in an isolated consumer
        run: node scripts/release/verify-installation.js "$RUNNER_TEMP/release-packages"

  publish:
    name: Publish verified packages
    needs: [plan, assemble, verify-installation]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-packages
      # No project dependency install, package execution, or custom OIDC exchange.
      - name: Publish the original verified tarballs
        env:
          SOURCE_COMMIT: ${{ needs.assemble.outputs.source-commit }}
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest-sha256 }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node scripts/release/publish.js "$RUNNER_TEMP/release-packages" \
            --source-commit "$SOURCE_COMMIT" --manifest-sha256 "$MANIFEST_SHA256" --tag "$TAG" --publish

  finalize:
    name: Finalize GitHub release
    needs: [plan, assemble, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      # Only reviewed source is read here; no build artifacts or package code.
      - name: Create the tag and GitHub release without replacing existing releases
        run: node scripts/release/workflow.js finalize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.assemble.outputs.source-commit }}
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest-sha256 }}
          ARTIFACT_ID: ${{ needs.assemble.outputs.artifact-id }}
