name: Release package checks

# Shadow pipeline only: no publication, environment, OIDC, or repository writes.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
        env:
          NX_DAEMON: 'false'
          NX_SKIP_NX_CACHE: 'true'
      - run: yarn test:unit

      # The common ancestor is packages/. The artifact therefore contains
      # auto-utils/dist/..., utility/asynchronous/dist/..., etc.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: compiled-outputs-${{ github.run_attempt }}
          path: |
            packages/*/dist/
            packages/utility/*/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      # No dependency install or build scripts in this fresh job.
      - name: Test the assembly boundary
        run: node --test scripts/release/assembly.test.js

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/compiled-outputs

      - name: Assemble packages from reviewed source and compiled files
        run: node scripts/release/assemble.js "$RUNNER_TEMP/compiled-outputs" "$RUNNER_TEMP/release-packages"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: release-packages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 14

  verify-installation:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-packages

      - name: Install and check the assembled packages in an isolated consumer
        run: node scripts/release/verify-installation.js "$RUNNER_TEMP/release-packages"
