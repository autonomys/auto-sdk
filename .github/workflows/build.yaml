name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build all packages and run tests
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint 🔍
        run: yarn lint

      - name: Check formatting 💅
        run: yarn format:check

      - name: Build all packages 🔧
        run: yarn build

      - name: Run tests 🧪
        run: yarn lerna run test --ignore @autonomys/integration-tests

      - name: Pack packages 📦
        run: node scripts/pack-packages.js "$RUNNER_TEMP/tarballs"

      - name: Check what a release would publish
        run: node scripts/publish-packages.js "$RUNNER_TEMP/tarballs/manifest.json"
        env:
          DRY_RUN: 'true'
